<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon-black.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon-white.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<title>Book a conversation | Priyanshu Bhagwatkar</title>
<meta name="description" content="Book a 30 minute introductory conversation with Priyanshu Bhagwatkar.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
*{margin:0;box-sizing:border-box}body{background:#131417;color:#f0eeea;font-family:Geist,sans-serif}a{color:inherit;text-decoration:none}
.shell{max-width:1150px;margin:auto;padding:0 28px}
.mono{font:500 11px "Geist Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:#a1a1a1}
.display{font-weight:500;letter-spacing:-.055em;text-transform:uppercase;line-height:.9}
.top{height:84px;border-bottom:1px solid #ffffff25;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:13px;font-weight:600;letter-spacing:.16em}
.back{font:500 11px "Geist Mono",monospace;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid #f0eeea;padding-bottom:6px}
.hero{padding:56px 0 0}
.book{padding:40px 0 74px}.book h2{font-size:42px;margin-top:18px}
.book p.lead{color:#b9b9b9;line-height:1.6;margin-top:14px;max-width:640px}
.cal{margin-top:28px;background:#fff;border:1px solid #ffffff25}
.cal iframe{display:block;width:100%;height:1000px;border:0;background:#fff}
.bottom{border-top:1px solid #ffffff25;padding:30px 0}.bottom .shell{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
@media(max-width:700px){.shell{padding:0 20px}.hero{padding-top:40px}.book h2{font-size:34px}.cal iframe{height:1400px}}
html.has-cursor body,html.has-cursor a,html.has-cursor button{cursor:none}
.cursor{z-index:90;pointer-events:none;position:fixed;top:0;left:0;transition:opacity .2s}.cursor.is-off{opacity:0}
.cursor-dot{position:absolute;top:0;left:0;translate:-50% -50%;width:8px;height:8px;border-radius:999px;background:#000;border:1px solid transparent;transition:width .35s cubic-bezier(.22,1,.36,1),height .35s cubic-bezier(.22,1,.36,1),background .3s,border-color .3s}
.cursor[data-mode=link] .cursor-dot{width:36px;height:36px;background:transparent;border-color:#000}
.cursor[data-tone=dark] .cursor-dot{background:#fff}
.cursor[data-tone=dark][data-mode=link] .cursor-dot{background:transparent;border-color:#fff}
</style></head><body>
<header class="shell top"><a class="brand" href="index.html">PRIYANSHU BHAGWATKAR</a><a class="back" href="index.html">← Back to main</a></header>
<main class="shell">
<section class="hero"><p class="mono">Contact</p></section>
<section class="book">
<p class="mono">Google Calendar · Appointments</p>
<h2 class="display">Book a conversation.</h2>
<p class="lead">Choose a time that works for you and book directly in the calendar below.</p>
<div class="cal"><iframe title="Google Calendar appointment scheduling" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ197eWM7pidFRMMgLWgAFqJ9GCb2dUXdaRjqtOrItRkENAxPerwLwrC5et2Hk5LfjuSYDkQ83_1?gv=true" loading="lazy" allow="clipboard-write"></iframe></div>
</section>
</main>
<footer class="bottom"><div class="shell"><span class="display" style="font-size:21px">Priyanshu Bhagwatkar</span><span class="mono">Hyderabad · 2026</span></div></footer>
<script>
(function(){
  if(!(window.matchMedia&&matchMedia('(hover: hover) and (pointer: fine)').matches)) return;
  document.documentElement.classList.add('has-cursor');
  const cur=document.createElement('div'); cur.className='cursor'; cur.setAttribute('aria-hidden','true');
  const dot=document.createElement('span'); dot.className='cursor-dot'; cur.appendChild(dot); document.body.appendChild(cur);
  const hide=()=>cur.classList.add('is-off'), show=()=>cur.classList.remove('is-off');
  document.querySelectorAll('iframe').forEach(f=>{f.addEventListener('mouseenter',hide);f.addEventListener('mouseleave',show);});
  document.documentElement.addEventListener('mouseleave',hide); window.addEventListener('blur',hide);
  const cv=document.createElement('canvas'); cv.width=cv.height=1; const cx=cv.getContext('2d',{willReadFrequently:true}); const cache=new Map();
  const rgba=c=>{ if(cache.has(c)) return cache.get(c); cx.clearRect(0,0,1,1); cx.fillStyle='#000'; cx.fillStyle=c; cx.fillRect(0,0,1,1); const d=cx.getImageData(0,0,1,1).data; const v=[d[0],d[1],d[2],d[3]/255]; cache.set(c,v); return v; };
  const dark=el=>{ while(el&&el.nodeType===1){ const v=rgba(getComputedStyle(el).backgroundColor); if(v[3]>0.5) return (0.2126*v[0]+0.7152*v[1]+0.0722*v[2])/255<0.45; el=el.parentElement; } return false; };
  let tx=-100,ty=-100,x=tx,y=ty;
  const tone=el=>{ if(dark(el)) cur.dataset.tone='dark'; else delete cur.dataset.tone; };
  addEventListener('pointermove',e=>{ tx=e.clientX; ty=e.clientY; if(e.target&&e.target.tagName!=='IFRAME') show();
    cur.dataset.mode=e.target?.closest?.('a,button')?'link':''; tone(e.target); },{passive:true});
  addEventListener('scroll',()=>{ const el=document.elementFromPoint(tx,ty); if(el) tone(el); },{passive:true});
  const loop=()=>{ x+=(tx-x)*.22; y+=(ty-y)*.22; cur.style.transform=`translate3d(${x}px,${y}px,0)`; requestAnimationFrame(loop); }; loop();
})();
</script>
</body></html>
